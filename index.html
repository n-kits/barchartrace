<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейтинг Картографов</title>
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bar-row {
            top: 0;
            transition: transform 0.8s cubic-bezier(0.33, 1, 0.68, 1), opacity 0.4s ease;
            will-change: transform, opacity;
        }

        /* Стили ползунка */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
            width: 100%;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            background: #1e293b;
            height: 6px;
            border-radius: 3px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            margin-top: -5px;
            background-color: #94a3b8;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            transition: background-color 0.15s ease-in-out;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background-color: #cbd5e1;
        }

        /* Анимация импульса медалей при смене месяца (Тач-эффект) */
        @keyframes medalPop {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 0px rgba(251, 191, 36, 0));
            }

            35% {
                transform: scale(1.35);
                filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.7));
            }

            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 0px rgba(251, 191, 36, 0));
            }
        }

        .animate-pop {
            animation: medalPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Тёмный скроллбар для списка участников */
        #chart-scroll {
            scrollbar-width: thin;
            scrollbar-color: #334155 #0C1424;
        }

        #chart-scroll::-webkit-scrollbar {
            width: 8px;
        }

        #chart-scroll::-webkit-scrollbar-track {
            background: #0C1424;
            border-radius: 4px;
        }

        #chart-scroll::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 4px;
        }

        #chart-scroll::-webkit-scrollbar-thumb:hover {
            background-color: #475569;
        }
    </style>
</head>

<body class="bg-[#060B14] text-slate-100 h-screen overflow-hidden flex flex-col font-sans select-none antialiased">

    <!-- Основной контейнер занимает всю высоту -->
    <main class="w-full max-w-[1600px] mx-auto p-4 md:p-6 flex flex-col h-full">

        <!-- Заголовок -->
        <header class="mb-4 flex-shrink-0 flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <h1
                    class="text-2xl md:text-3xl font-black tracking-tight text-white bg-clip-text bg-gradient-to-r from-slate-100 to-slate-300 text-transparent">
                    Гонка Картографов
                </h1>
                <p id="date-range" class="text-slate-500 text-xs md:text-sm mt-1">Загрузка данных...</p>
            </div>
            <!-- Сюда динамически добавятся кнопки годов -->
            <div id="year-filters" class="flex flex-wrap gap-2 text-sm font-semibold"></div>
        </header>

        <!-- Область графика -->
        <div id="chart-area" class="relative bg-[#0C1424] rounded-xl p-4 md:p-6 flex-1 flex flex-col overflow-hidden shadow-2xl">

            <!-- Водяной знак -->
            <div
                class="absolute bottom-8 right-[90px] md:right-[106px] flex flex-col items-end z-0 select-none pointer-events-none opacity-20 whitespace-nowrap">
                <div id="watermark-date"
                    class="text-6xl md:text-8xl font-black text-slate-500 font-mono tracking-tighter leading-none">
                    --.--.----
                </div>
                <div class="text-4xl md:text-5xl font-bold text-slate-500 font-mono mt-2 pr-2">
                    Всего: <span id="watermark-total">0</span>
                </div>
            </div>

            <!-- Общая область без своего padding — чтобы проценты высоты у обоих слоёв ниже считались одинаково -->
            <div class="relative w-full flex-1 min-h-0 mt-2">
                <!-- Линии сетки с подписями значений — фиксированы, не участвуют в скролле -->
                <div id="grid-lines"
                    class="absolute inset-0 right-[70px] pointer-events-none select-none z-0">
                </div>

                <!-- Скроллируемый список участников -->
                <div id="chart-scroll" class="absolute inset-0 z-10 overflow-y-auto overflow-x-hidden">
                    <div id="chart-container" class="relative w-full"></div>
                </div>
            </div>
        </div>

        <!-- Панель управления -->
        <footer class="mt-4 flex-shrink-0 bg-[#0C1424] rounded-xl p-3 flex flex-col gap-3 shadow-xl">
            <div class="flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <button id="btn-play"
                        class="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-white transition duration-150 shadow-md">
                        <svg id="icon-play" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                        <svg id="icon-pause" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                        </svg>
                    </button>
                    <button id="btn-reset"
                        class="p-2 bg-slate-800/80 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-slate-200 transition duration-150">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                            <path d="M3 3v5h5" />
                        </svg>
                    </button>

                    <div class="flex items-center bg-[#060B14] rounded-lg p-1 border border-slate-800/50 ml-2">
                        <span class="text-[10px] uppercase font-bold text-slate-500 px-2 tracking-wider">Скорость</span>
                        <div class="flex text-xs font-semibold">
                            <button class="speed-btn px-2 py-1 rounded" data-speed="0.5">0.5x</button>
                            <button class="speed-btn px-2 py-1 rounded bg-slate-700 text-white shadow"
                                data-speed="1">1x</button>
                            <button class="speed-btn px-2 py-1 rounded" data-speed="2.5">2.5x</button>
                            <button class="speed-btn px-2 py-1 rounded" data-speed="5">5x</button>
                            <button class="speed-btn px-2 py-1 rounded" data-speed="10">10x</button>
                            <button class="speed-btn px-2 py-1 rounded" data-speed="20">20x</button>
                        </div>
                    </div>
                </div>

                <div class="text-right whitespace-nowrap">
                    <div id="current-date" class="text-base font-bold font-mono text-slate-200 leading-tight">--.--.----
                    </div>
                    <div id="day-counter" class="text-[10px] text-slate-500 font-mono uppercase tracking-widest">День 0
                        / 0</div>
                </div>
            </div>

            <!-- Таймлайн -->
            <div class="relative w-full pt-1 pb-4">
                <input id="timeline-slider" type="range" min="0" max="1" step="any" value="0" class="relative z-10"
                    disabled>
                <div id="timeline-labels" class="absolute top-6 left-0 right-0 w-full h-4 pointer-events-none"></div>
            </div>
        </footer>
    </main>

    <script>
        const MEDAL_CONFIG = {
            emojiSize: "text-[11px]",
            digitSize: "text-[10.5px]",
            gapBetween: "gap-1.5",
            gapInside: "gap-0.5",
            useXFormat: true,
            order: "emoji-first"
        };

        // Глобальные переходящие рекорды: эмодзи, цвета и размеры каждого типа можно менять здесь
        const RECORD_CONFIG = {
            day: { emoji: "🔥", color: "text-orange-400", bg: "bg-orange-400/10" },
            month: { emoji: "🌋", color: "text-red-400", bg: "bg-red-400/10" },
            crown: { emoji: "👑", color: "text-amber-400", bg: "bg-amber-400/10" },
            emojiSize: "text-[11px]",
            valueSize: "text-[10.5px]",
            gapBetween: "gap-0.5",
            gapInside: "gap-0.5",
            padding: "px-1 py-0.5"
        };

        const rowHeight = 52;
        const gap = 10;
        // Лимит снят: показываем всех участников списком со скроллом

        const chartContainer = document.getElementById('chart-container');
        const btnPlay = document.getElementById('btn-play');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const btnReset = document.getElementById('btn-reset');
        const slider = document.getElementById('timeline-slider');
        const textCurrentDate = document.getElementById('current-date');
        const textDateRange = document.getElementById('date-range');
        const textWatermarkDate = document.getElementById('watermark-date');
        const textWatermarkTotal = document.getElementById('watermark-total');
        const textDayCounter = document.getElementById('day-counter');
        const speedButtons = document.querySelectorAll('.speed-btn');
        const yearFiltersContainer = document.getElementById('year-filters');

        const gridLinesContainer = document.getElementById('grid-lines');
        let lastNameColWidth = 0;

        let isPlaying = false;
        let currentStep = 0;
        let speedFactor = 1;
        let lastTimestamp = null;
        let sliderIsActive = false;

        let domCache = [];
        let gridCache = new Map();
        let lastTickKey = '';

        // Сырые данные из CSV
        let rawDates = [];
        let rawCandidates = [];
        let availableYears = [];

        // Текущие данные
        let dates = [];
        let candidates = [];

        // Преаллоцированные массивы для RAF
        let indices = [];
        let ranks = [];
        let currentMedalCounts = [];

        let activeMonthlyWinners = [];
        let lastCompletedCount = 0;

        // Глобальные переходящие рекорды (по дням, для O(1) обращения в draw())
        let dayRecordTimeline = [];   // {value, holders[]} — макс. задач за один день
        let monthRecordTimeline = []; // {value, holders[]} — макс. задач суммарно за один месяц
        let crownTimeline = [];       // {value, holders[]} — макс. дней в лидерах

        // ИСПРАВЛЕНО: Массив для хранения выбранных пользователем годов
        let selectedYears = [];

        function getInitials(name) {
            return name.split(' ').map(n => n[0]).filter(Boolean).slice(0, 2).join('');
        }

        const MONTH_ABBR = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

        // дд.мм.гг — для подписи даты дневного рекорда
        function formatDayShort(dateStr) {
            const [d, m, y] = dateStr.split('.');
            return `${d}.${m}.${y.slice(-2)}`;
        }

        // ммм'гг — для подписи месяца рекорда (три первых буквы месяца)
        function formatMonthShort(dateStr) {
            const [, m, y] = dateStr.split('.');
            return `${MONTH_ABBR[parseInt(m, 10) - 1]}'${y.slice(-2)}`;
        }

        function isMonthEnd(dateStr, nextDateStr) {
            if (!nextDateStr) {
                const [d, m, y] = dateStr.split('.').map(Number);
                const lastDay = new Date(y, m, 0).getDate();
                return d === lastDay;
            }
            const currentParts = dateStr.split('.');
            const nextParts = nextDateStr.split('.');
            return currentParts[1] !== nextParts[1] || currentParts[2] !== nextParts[2];
        }

        async function loadData() {
            try {
                const response = await fetch('data.csv');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const csvText = await response.text();

                parseCSV(csvText);
                buildYearFilters();

                const currentYear = new Date().getFullYear().toString();
                if (availableYears.includes(currentYear)) {
                    applyFilter(currentYear);
                } else if (availableYears.length > 0) {
                    applyFilter(availableYears[availableYears.length - 1]);
                } else {
                    applyFilter('all');
                }
            } catch (error) {
                console.error("Ошибка загрузки CSV:", error);
                textDateRange.textContent = "Ошибка загрузки файла data.csv. Убедитесь, что файл лежит рядом с index.html.";
            }
        }

        function parseCSV(text) {
            if (text.charCodeAt(0) === 0xFEFF) text = text.substring(1);
            const lines = text.trim().replace(/\r/g, '').split('\n').map(l => l.split(','));
            const headers = lines[0];

            rawDates = headers.slice(3).map(d => d.trim());
            rawCandidates = [];

            const yearsSet = new Set(rawDates.map(d => d.split('.')[2]));
            availableYears = Array.from(yearsSet).sort();

            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i];
                if (cols.length < 4) continue;
                rawCandidates.push({
                    name: cols[0].trim(),
                    avatar: cols[1].trim(),
                    dept: cols[2].trim(),
                    allValues: cols.slice(3).map(v => parseFloat(v) || 0)
                });
            }
        }

        function buildYearFilters() {
            yearFiltersContainer.innerHTML = '';

            const btnAll = document.createElement('button');
            btnAll.textContent = "За всё время";
            btnAll.className = "filter-btn px-3 py-1.5 rounded bg-slate-800/80 hover:bg-slate-700 transition shadow text-slate-400";
            btnAll.dataset.year = "all";
            btnAll.onclick = () => applyFilter('all');
            yearFiltersContainer.appendChild(btnAll);

            if (availableYears.length > 1) {
                availableYears.forEach(year => {
                    const btn = document.createElement('button');
                    btn.textContent = year;
                    btn.className = "filter-btn px-3 py-1.5 rounded bg-slate-800/80 hover:bg-slate-700 transition text-slate-400";
                    btn.dataset.year = year;
                    btn.onclick = () => applyFilter(year);
                    yearFiltersContainer.appendChild(btn);
                });
            }
        }

        // ИСПРАВЛЕНО: Полностью переписанная функция фильтрации с поддержкой мультивыбора
        function applyFilter(clickedYear) {
            isPlaying = false;
            updatePlayPauseState();
            currentStep = 0;
            lastCompletedCount = 0;

            if (clickedYear === 'all') {
                selectedYears = []; // Пустой массив означает "За всё время"
            } else {
                const index = selectedYears.indexOf(clickedYear);
                if (index > -1) {
                    // Если год уже выбран
                    if (selectedYears.length > 1) {
                        // Удаляем его из списка выделенных
                        selectedYears.splice(index, 1);

                        // Пересчитываем непрерывный диапазон для оставшихся годов
                        const numericYears = selectedYears.map(Number);
                        const min = Math.min(...numericYears);
                        const max = Math.max(...numericYears);
                        selectedYears = availableYears.filter(y => {
                            const numY = Number(y);
                            return numY >= min && numY <= max;
                        });
                    } else {
                        // Если это был единственный выбранный год — сбрасываем на "За всё время"
                        selectedYears = [];
                    }
                } else {
                    // Добавляем новый год в выборку
                    selectedYears.push(clickedYear);

                    // Гарантируем непрерывность (склеиваем пропущенные года)
                    const numericYears = selectedYears.map(Number);
                    const min = Math.min(...numericYears);
                    const max = Math.max(...numericYears);
                    selectedYears = availableYears.filter(y => {
                        const numY = Number(y);
                        return numY >= min && numY <= max;
                    });
                }
            }

            // Обновляем визуальный стиль кнопок на основе выбранных годов
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(btn => {
                const btnYear = btn.dataset.year;
                if (btnYear === 'all') {
                    if (selectedYears.length === 0) {
                        btn.className = "filter-btn px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600 transition shadow text-white";
                    } else {
                        btn.className = "filter-btn px-3 py-1.5 rounded bg-slate-800/80 hover:bg-slate-700 transition text-slate-400";
                    }
                } else {
                    if (selectedYears.includes(btnYear)) {
                        btn.className = "filter-btn px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600 transition shadow text-white";
                    } else {
                        btn.className = "filter-btn px-3 py-1.5 rounded bg-slate-800/80 hover:bg-slate-700 transition text-slate-400";
                    }
                }
            });

            // Нарезаем и вычисляем данные
            if (selectedYears.length === 0) {
                dates = [...rawDates];
                candidates = rawCandidates.map(c => ({ ...c, values: [...c.allValues] }));
            } else {
                const startYear = selectedYears[0];
                const endYear = selectedYears[selectedYears.length - 1];

                const startIndex = rawDates.findIndex(d => d.split('.')[2] === startYear);

                let endIndex = -1;
                for (let i = rawDates.length - 1; i >= 0; i--) {
                    if (rawDates[i].split('.')[2] === endYear) {
                        endIndex = i;
                        break;
                    }
                }

                dates = rawDates.slice(startIndex, endIndex + 1);
                candidates = rawCandidates.map(c => {
                    const baseline = startIndex > 0 ? c.allValues[startIndex - 1] : 0;
                    return {
                        ...c,
                        values: c.allValues.slice(startIndex, endIndex + 1).map(v => Math.max(0, v - baseline))
                    };
                });
            }

            // Предварительный расчет медалей и глобальных рекордов для выбранного диапазона
            activeMonthlyWinners = [];
            dayRecordTimeline = new Array(dates.length);
            monthRecordTimeline = new Array(dates.length);
            crownTimeline = new Array(dates.length);
            let prevMonthEndIndex = -1;

            let currentDayRecord = { value: 0, holders: [] };
            let currentMonthRecord = { value: 0, holders: [] };
            const crownTally = new Array(candidates.length).fill(0);
            let currentCrownRecord = { value: 0, holders: [] };

            // Обновляет "бегущий рекорд" по правилу: строго больше — заменяет держателей,
            // равно текущему максимуму — добавляет держателя (ничья делится), меньше — не влияет.
            // meta — произвольная подпись держателя (например, дата рекорда), хранится вместе с ним.
            function updateRunningRecord(record, val, holderIndex, meta) {
                if (val <= 0) return record;
                if (val > record.value) return { value: val, holders: [{ index: holderIndex, meta }] };
                if (val === record.value && !record.holders.some(h => h.index === holderIndex)) {
                    return { value: val, holders: [...record.holders, { index: holderIndex, meta }] };
                }
                return record;
            }

            for (let i = 0; i < dates.length; i++) {
                // --- Огонёк: рекорд задач за один день ---
                for (let c = 0; c < candidates.length; c++) {
                    const prevVal = i > 0 ? candidates[c].values[i - 1] : 0;
                    const delta = candidates[c].values[i] - prevVal;
                    currentDayRecord = updateRunningRecord(currentDayRecord, delta, c, formatDayShort(dates[i]));
                }
                dayRecordTimeline[i] = currentDayRecord;

                // --- Царь горы: дни, суммарно проведённые на 1-м месте ---
                let leaderVal = 0, leaders = [];
                for (let c = 0; c < candidates.length; c++) {
                    const v = candidates[c].values[i];
                    if (v > leaderVal) { leaderVal = v; leaders = [c]; }
                    else if (v === leaderVal && v > 0) { leaders.push(c); }
                }
                leaders.forEach(c => crownTally[c]++);
                for (let c = 0; c < candidates.length; c++) {
                    currentCrownRecord = updateRunningRecord(currentCrownRecord, crownTally[c], c, null);
                }
                crownTimeline[i] = currentCrownRecord;

                if (isMonthEnd(dates[i], dates[i + 1])) {
                    const standings = candidates.map((c, index) => {
                        const startVal = prevMonthEndIndex !== -1 ? c.values[prevMonthEndIndex] : 0;
                        const endVal = c.values[i];
                        return { index, val: Math.max(0, endVal - startVal) };
                    }).filter(s => s.val > 0);

                    // Уникальные результаты по убыванию — каждому месту соответствует свой результат,
                    // и медаль получают ВСЕ с этим результатом (ничьи делят место)
                    const distinctValues = [...new Set(standings.map(s => s.val))].sort((a, b) => b - a);

                    const byValue = (val) => val === undefined ? [] : standings.filter(s => s.val === val).map(s => s.index);

                    activeMonthlyWinners.push({
                        index: i,
                        gold: byValue(distinctValues[0]),
                        silver: byValue(distinctValues[1]),
                        bronze: byValue(distinctValues[2])
                    });

                    // --- Вулкан: рекорд суммы задач за один календарный месяц ---
                    const monthLabel = formatMonthShort(dates[i]);
                    standings.forEach(s => {
                        currentMonthRecord = updateRunningRecord(currentMonthRecord, s.val, s.index, monthLabel);
                    });

                    prevMonthEndIndex = i;
                }
                monthRecordTimeline[i] = currentMonthRecord;
            }

            // Пересоздаем преаллоцированные структуры под новый размер candidates
            indices = new Array(candidates.length);
            ranks = new Array(candidates.length);
            currentMedalCounts = new Array(candidates.length);
            for (let i = 0; i < candidates.length; i++) currentMedalCounts[i] = { gold: 0, silver: 0, bronze: 0 };

            initDOM();
            draw();
        }

        function initDOM() {
            chartContainer.innerHTML = '';
            gridLinesContainer.innerHTML = '';
            gridCache.clear();
            domCache = [];
            lastTickKey = '';

            textDateRange.textContent = `Динамика результатов с ${dates[0]} по ${dates[dates.length - 1]}`;
            slider.disabled = false;
            slider.max = dates.length - 1;

            chartContainer.style.height = `${candidates.length * (rowHeight + gap)}px`;

            candidates.forEach((c, index) => {
                const initials = getInitials(c.name);
                const row = document.createElement('div');
                row.className = `bar-row absolute left-0 right-0 flex items-center z-10`;
                row.style.height = `${rowHeight}px`;
                row.style.transform = `translateY(200vh)`;
                row.style.opacity = '0';

                row.innerHTML = `
                    <div class="rank-display w-6 text-right font-mono font-black pr-2 select-none text-sm md:text-base"></div>
                    <div class="name-column flex-shrink-0 flex flex-col justify-center pr-3 select-none">
                        <div class="flex items-center gap-1 min-w-0">
                            <div class="name-label font-bold text-xs md:text-sm truncate transition-colors duration-300 text-white min-w-0">${c.name}</div>
                            <div class="records-badges flex items-center ${RECORD_CONFIG.gapBetween} flex-shrink-0 overflow-visible"></div>
                        </div>
                        <div class="mt-0.5 flex items-center gap-1.5 overflow-visible">
                            <span class="text-[9px] uppercase tracking-wider bg-[#0C1424] px-1.5 py-0.5 rounded text-slate-400 font-semibold border border-slate-700/50">${c.dept}</span>
                            <div class="medals-container flex items-center ${MEDAL_CONFIG.gapBetween} ${MEDAL_CONFIG.emojiSize} overflow-visible hover:scale-110 transition duration-150"></div>
                        </div>
                    </div>
                    <div class="flex-1 relative h-10 bg-slate-800/30 rounded-md flex items-center mr-16">
                        <div class="bar-fill absolute left-0 top-0 bottom-0 rounded-l transition-colors duration-300 w-0"></div>
                        <div class="avatar-container absolute w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center border-2 shadow-sm overflow-hidden z-20 transition-colors duration-300" style="left: 0;">
                            <img src="${c.avatar}" alt="${c.name}" onerror="this.classList.add('hidden'); this.nextElementSibling.classList.remove('hidden');" class="w-full h-full object-cover">
                            <div class="hidden text-sm font-black text-slate-300 uppercase">${initials}</div>
                        </div>
                        <div class="value-label absolute z-20 font-mono font-bold text-sm md:text-base select-none left-0">0</div>
                    </div>
                `;
                chartContainer.appendChild(row);

                domCache.push({
                    rowEl: row,
                    barFill: row.querySelector('.bar-fill'),
                    avatarContainer: row.querySelector('.avatar-container'),
                    rankDisplay: row.querySelector('.rank-display'),
                    valueLabel: row.querySelector('.value-label'),
                    nameLabel: row.querySelector('.name-label'),
                    nameColumn: row.querySelector('.name-column'),
                    medalsContainer: row.querySelector('.medals-container'),
                    recordsBadges: row.querySelector('.records-badges'),
                    lastRank: -1,
                    currentValue: 0,
                    lastMedalsHTML: '',
                    lastRecordsHTML: '',
                    lastDayRecordValue: null,
                    lastMonthRecordValue: null
                });
            });

            lastNameColWidth = 0;
            updateNameColumnWidth();

            const timelineLabels = document.getElementById('timeline-labels');
            let labelsHTML = '';
            const step = Math.ceil(dates.length / 8);
            for (let i = 0; i < dates.length; i += step) {
                const percentage = (i / (dates.length - 1)) * 100;
                if (percentage > 2 && percentage < 98) {
                    labelsHTML += `<span style="left: ${percentage}%; transform: translateX(-50%)" class="absolute text-[10px] text-slate-500 font-mono">${dates[i]}</span>`;
                }
            }
            labelsHTML += `<span style="left: 0%;" class="absolute text-[10px] text-slate-500 font-mono">${dates[0]}</span>`;
            labelsHTML += `<span style="left: 100%; transform: translateX(-100%)" class="absolute text-[10px] text-slate-500 font-mono">${dates[dates.length - 1]}</span>`;

            timelineLabels.innerHTML = labelsHTML;
        }

        function getNiceTicks(maxVal, maxTicks = 5) {
            if (maxVal <= 0) return [];
            const roughStep = maxVal / maxTicks;
            const mag = Math.pow(10, Math.floor(Math.log10(roughStep)));
            const norm = roughStep / mag;
            let step;
            if (norm < 1.5) step = 1; else if (norm < 3) step = 2; else if (norm < 7) step = 5; else step = 10;
            step *= mag;
            const ticks = [];
            const start = step;
            for (let i = start; i <= maxVal; i += step) ticks.push(i);
            return ticks;
        }

        function updateDynamicGrid(maxVal) {
            const ticks = getNiceTicks(maxVal, 5);
            const tickKey = ticks.join(',');
            const isScaleChanged = tickKey !== lastTickKey;
            lastTickKey = tickKey;

            const activeVals = new Set(ticks);

            gridCache.forEach((el, val) => {
                const percentage = (val / maxVal) * 100;
                el.style.left = `${percentage}%`;

                if (isScaleChanged && !activeVals.has(val)) {
                    el.style.opacity = '0';
                }
                if (percentage < -5 || percentage > 150) {
                    el.remove();
                    gridCache.delete(val);
                }
            });

            if (!gridCache.has(0)) {
                const zeroEl = document.createElement('div');
                zeroEl.className = 'absolute top-0 bottom-0 border-r border-slate-700/30';
                zeroEl.style.left = '0%';
                zeroEl.innerHTML = `<span class="absolute top-[-20px] right-0 translate-x-1/2 text-[11px] font-bold text-slate-600 font-mono">0</span>`;
                gridLinesContainer.appendChild(zeroEl);
                gridCache.set(0, zeroEl);
            }

            if (!isScaleChanged) return;

            ticks.forEach(val => {
                if (!gridCache.has(val)) {
                    const el = document.createElement('div');
                    el.className = 'absolute top-0 bottom-0 border-r border-slate-700/30 transition-opacity duration-700';
                    el.style.opacity = '0';
                    el.innerHTML = `<span class="absolute top-[-20px] right-0 translate-x-1/2 text-[11px] font-bold text-slate-600 font-mono">${val}</span>`;
                    gridLinesContainer.appendChild(el);
                    gridCache.set(val, el);
                    void el.offsetWidth;
                    el.style.opacity = '1';
                    el.style.left = `${(val / maxVal) * 100}%`;
                } else {
                    gridCache.get(val).style.opacity = '1';
                }
            });
        }

        // Динамически подгоняет ширину колонки "имя + бейджи" под самый широкий
        // на данный момент ряд (имя + медали/рекорды), сдвигая левый край всех столбов и сетки,
        // чтобы фамилии не обрезались.
        // Важно: box-sizing: border-box — значит style.width должен включать padding колонки,
        // иначе реального места под текст будет на namePadding меньше, чем нужно.
        function updateNameColumnWidth() {
            const namePadding = 12; // pr-3 у name-column (входит в border-box ширину)

            let maxContentNeeded = 0;
            for (let i = 0; i < domCache.length; i++) {
                const els = domCache[i];
                const badgesWidth = els.recordsBadges.children.length > 0 ? els.recordsBadges.offsetWidth + 4 : 0;
                const needed = els.nameLabel.scrollWidth + badgesWidth;
                if (needed > maxContentNeeded) maxContentNeeded = needed;
            }

            const isMd = window.innerWidth >= 768;
            const minContent = (isMd ? 192 : 128) - namePadding;
            const maxContent = (isMd ? 300 : 210) - namePadding;
            const targetContent = Math.round(Math.max(minContent, Math.min(maxContent, maxContentNeeded)));
            const targetBoxWidth = targetContent + namePadding;

            if (targetBoxWidth === lastNameColWidth) return;
            lastNameColWidth = targetBoxWidth;

            for (let i = 0; i < domCache.length; i++) {
                domCache[i].nameColumn.style.width = `${targetBoxWidth}px`;
            }

            const rankColumnWidth = 24; // rank-display (w-6, border-box — pr-2 уже внутри)
            gridLinesContainer.style.left = `${rankColumnWidth + targetBoxWidth}px`;
        }

        function applyRankDesign(els, rank) {
            els.barFill.className = "bar-fill absolute left-0 top-0 bottom-0 rounded-l transition-colors duration-300";
            els.avatarContainer.className = "avatar-container absolute w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center border-2 overflow-hidden z-20 transition-colors duration-300";
            els.rankDisplay.className = "rank-display w-6 text-right font-mono font-black pr-2 select-none text-sm md:text-base";
            els.valueLabel.className = "value-label absolute z-20 font-mono font-bold text-sm md:text-base select-none";
            els.nameLabel.className = "name-label font-bold text-xs md:text-sm truncate transition-colors duration-300";

            if (rank === 0) {
                els.barFill.classList.add('bg-gradient-to-r', 'from-amber-600', 'to-amber-400', 'shadow-[0_0_15px_rgba(245,158,11,0.5)]');
                els.avatarContainer.classList.add('border-amber-400', 'shadow-[0_0_10px_rgba(245,158,11,0.4)]');
                els.rankDisplay.classList.add('text-amber-400', 'text-base', 'scale-110');
                els.valueLabel.classList.add('text-amber-400');
                els.nameLabel.classList.add('text-amber-400');
            } else if (rank === 1) {
                els.barFill.classList.add('bg-gradient-to-r', 'from-slate-500', 'to-slate-300', 'shadow-[0_0_12px_rgba(203,213,225,0.4)]');
                els.avatarContainer.classList.add('border-slate-300', 'shadow-[0_0_8px_rgba(203,213,225,0.4)]');
                els.rankDisplay.classList.add('text-slate-300');
                els.valueLabel.classList.add('text-slate-200');
                els.nameLabel.classList.add('text-slate-300');
            } else if (rank === 2) {
                els.barFill.classList.add('bg-gradient-to-r', 'from-orange-700', 'to-orange-500', 'shadow-[0_0_12px_rgba(249,115,22,0.4)]');
                els.avatarContainer.classList.add('border-orange-500', 'shadow-[0_0_8px_rgba(249,115,22,0.4)]');
                els.rankDisplay.classList.add('text-orange-400');
                els.valueLabel.classList.add('text-orange-400');
                els.nameLabel.classList.add('text-orange-400');
            } else {
                els.barFill.classList.add('bg-slate-700/60', 'border-r', 'border-slate-600/50');
                els.avatarContainer.classList.add('border-slate-600/50');
                els.rankDisplay.classList.add('text-slate-600');
                els.valueLabel.classList.add('text-slate-500');
                els.nameLabel.classList.add('text-white');
            }
        }

        function triggerMedalPop(candidateIndex) {
            if (candidateIndex === -1) return;
            const els = domCache[candidateIndex];
            if (els && els.medalsContainer) {
                els.medalsContainer.classList.remove('animate-pop');
                void els.medalsContainer.offsetWidth;
                els.medalsContainer.classList.add('animate-pop');
            }
        }

        // Тач-эффект для глобальных рекордов: срабатывает, когда тот же человек побивает свой же рекорд
        // (не используется для короны — там держатель "обновляет" рекорд буквально каждый день)
        function triggerRecordPop(candidateIndex) {
            const els = domCache[candidateIndex];
            if (els && els.recordsBadges) {
                els.recordsBadges.classList.remove('animate-pop');
                void els.recordsBadges.offsetWidth;
                els.recordsBadges.classList.add('animate-pop');
            }
        }

        function generateSingleMedalHTML(medalEmoji, value, title, colorClass) {
            const formattedValue = MEDAL_CONFIG.useXFormat ? `x${value}` : value;
            const emojiSpan = `<span>${medalEmoji}</span>`;
            const digitSpan = `<span class="${MEDAL_CONFIG.digitSize} ${colorClass} font-mono">${formattedValue}</span>`;
            const content = MEDAL_CONFIG.order === "emoji-first" ? emojiSpan + digitSpan : digitSpan + emojiSpan;
            return `<span class="flex items-center ${MEDAL_CONFIG.gapInside}" title="${title}">${content}</span>`;
        }

        // type: 'day' | 'month' | 'crown' — берёт эмодзи/цвет из RECORD_CONFIG[type]
        function generateRecordBadgeHTML(type, value, dateLabel) {
            const cfg = RECORD_CONFIG[type];
            const dateSuffix = dateLabel ? ` (${dateLabel})` : '';
            let titleText;
            if (type === 'day') titleText = `Абсолютный рекорд дня: ${value} за один день${dateSuffix}`;
            else if (type === 'month') titleText = `Абсолютный рекорд месяца: ${value} за один месяц${dateSuffix}`;
            else titleText = `Дольше всех в лидерах: ${value} дн.`;
            return `<span class="inline-flex items-center ${RECORD_CONFIG.gapInside} ${RECORD_CONFIG.emojiSize} leading-none ${cfg.bg} ${cfg.color} ${RECORD_CONFIG.padding} rounded font-mono font-bold" title="${titleText}"><span>${cfg.emoji}</span><span class="${RECORD_CONFIG.valueSize}">${value}</span></span>`;
        }

        function draw() {
            if (!dates.length) return;
            const step = currentStep;
            const idx = Math.floor(step);
            const idx2 = Math.min(idx + 1, dates.length - 1);
            const t = step - idx;

            textCurrentDate.textContent = dates[idx];
            textWatermarkDate.textContent = dates[idx];
            textDayCounter.textContent = `День ${idx + 1} / ${dates.length}`;

            let totalSum = 0;
            let maxVal = 1;

            for (let i = 0; i < candidates.length; i++) {
                const val1 = candidates[i].values[idx];
                const val2 = candidates[i].values[idx2];
                const curVal = val1 + (val2 - val1) * t;
                domCache[i].currentValue = curVal;
                totalSum += curVal;
                if (curVal > maxVal) maxVal = curVal;
                indices[i] = i;
            }

            textWatermarkTotal.textContent = Math.round(totalSum).toLocaleString('ru-RU');
            updateDynamicGrid(maxVal);

            indices.sort((a, b) => {
                const valA = domCache[a].currentValue;
                const valB = domCache[b].currentValue;
                if (valB !== valA) return valB - valA;
                return candidates[a].name.localeCompare(candidates[b].name);
            });

            for (let i = 0; i < indices.length; i++) ranks[indices[i]] = i;

            let completedMonthsCount = 0;
            for (const item of activeMonthlyWinners) {
                if (item.index <= idx) completedMonthsCount++;
            }

            if (completedMonthsCount !== lastCompletedCount) {
                for (let i = 0; i < candidates.length; i++) {
                    currentMedalCounts[i].gold = 0;
                    currentMedalCounts[i].silver = 0;
                    currentMedalCounts[i].bronze = 0;
                }
                for (let i = 0; i < completedMonthsCount; i++) {
                    const m = activeMonthlyWinners[i];
                    m.gold.forEach(idx => currentMedalCounts[idx].gold++);
                    m.silver.forEach(idx => currentMedalCounts[idx].silver++);
                    m.bronze.forEach(idx => currentMedalCounts[idx].bronze++);
                }

                if (isPlaying && completedMonthsCount > lastCompletedCount) {
                    const latestMonth = activeMonthlyWinners[completedMonthsCount - 1];
                    if (latestMonth) {
                        latestMonth.gold.forEach(triggerMedalPop);
                        latestMonth.silver.forEach(triggerMedalPop);
                        latestMonth.bronze.forEach(triggerMedalPop);
                    }
                }
                lastCompletedCount = completedMonthsCount;
            }

            const maxBarWidth = 100;
            const dayRecord = dayRecordTimeline[idx];
            const monthRecord = monthRecordTimeline[idx];
            const crownRecord = crownTimeline[idx];
            let badgesChanged = false;

            for (let i = 0; i < candidates.length; i++) {
                const rank = ranks[i];
                const els = domCache[i];

                els.rowEl.style.transform = `translateY(${rank * (rowHeight + gap)}px)`;
                els.rowEl.style.opacity = '1';

                const val = els.currentValue;
                const percentage = (val / maxVal) * maxBarWidth;

                els.valueLabel.textContent = Math.round(val).toLocaleString('ru-RU');
                els.rankDisplay.textContent = rank + 1;

                els.barFill.style.width = `${percentage}%`;
                els.valueLabel.style.left = `calc(${percentage}% + 10px)`;
                els.avatarContainer.style.left = `calc(max(0px, ${percentage}% - 40px))`;

                const count = currentMedalCounts[i];
                let medalsHTML = '';
                if (count.gold > 0) medalsHTML += generateSingleMedalHTML('🥇', count.gold, 'Золото', 'text-amber-400');
                if (count.silver > 0) medalsHTML += generateSingleMedalHTML('🥈', count.silver, 'Серебро', 'text-slate-300');
                if (count.bronze > 0) medalsHTML += generateSingleMedalHTML('🥉', count.bronze, 'Бронза', 'text-orange-400');

                if (medalsHTML !== els.lastMedalsHTML) {
                    els.medalsContainer.innerHTML = medalsHTML;
                    els.lastMedalsHTML = medalsHTML;
                    badgesChanged = true;
                }

                let recordsHTML = '';
                let selfBeatOwnRecord = false;

                const dayHolder = dayRecord.holders.find(h => h.index === i);
                if (dayHolder) {
                    recordsHTML += generateRecordBadgeHTML('day', dayRecord.value, dayHolder.meta);
                    if (els.lastDayRecordValue !== null && dayRecord.value > els.lastDayRecordValue) selfBeatOwnRecord = true;
                }
                els.lastDayRecordValue = dayHolder ? dayRecord.value : null;

                const monthHolder = monthRecord.holders.find(h => h.index === i);
                if (monthHolder) {
                    recordsHTML += generateRecordBadgeHTML('month', monthRecord.value, monthHolder.meta);
                    if (els.lastMonthRecordValue !== null && monthRecord.value > els.lastMonthRecordValue) selfBeatOwnRecord = true;
                }
                els.lastMonthRecordValue = monthHolder ? monthRecord.value : null;

                if (isPlaying && selfBeatOwnRecord) triggerRecordPop(i);

                const crownHolder = crownRecord.holders.find(h => h.index === i);
                if (crownHolder) recordsHTML += generateRecordBadgeHTML('crown', crownRecord.value, null);
                if (recordsHTML !== els.lastRecordsHTML) {
                    els.recordsBadges.innerHTML = recordsHTML;
                    els.lastRecordsHTML = recordsHTML;
                    badgesChanged = true;
                }

                if (els.lastRank !== rank) {
                    applyRankDesign(els, rank);
                    els.lastRank = rank;
                }
            }

            if (badgesChanged) updateNameColumnWidth();

            if (!sliderIsActive) slider.value = step;
        }

        function animate(timestamp) {
            if (!isPlaying) { lastTimestamp = null; return; }
            if (!lastTimestamp) lastTimestamp = timestamp;
            const dt = timestamp - lastTimestamp;
            lastTimestamp = timestamp;

            currentStep += (dt / 1000) * speedFactor;

            if (currentStep >= dates.length - 1) {
                currentStep = dates.length - 1;
                isPlaying = false;
                updatePlayPauseState();
                draw();
                return;
            }
            draw();
            requestAnimationFrame(animate);
        }

        function updatePlayPauseState() {
            if (isPlaying) {
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
            } else {
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
            }
        }

        btnPlay.addEventListener('click', () => {
            if (currentStep >= dates.length - 1) currentStep = 0;
            isPlaying = !isPlaying;
            updatePlayPauseState();
            if (isPlaying) requestAnimationFrame(animate);
        });

        btnReset.addEventListener('click', () => {
            isPlaying = false;
            currentStep = 0;
            lastCompletedCount = 0;
            updatePlayPauseState();
            draw();
        });

        slider.addEventListener('input', () => {
            sliderIsActive = true;
            isPlaying = false;
            updatePlayPauseState();
            currentStep = parseFloat(slider.value);
            draw();
        });

        slider.addEventListener('change', () => sliderIsActive = false);

        speedButtons.forEach(button => {
            button.addEventListener('click', () => {
                speedButtons.forEach(btn => btn.classList.remove('bg-slate-700', 'text-white', 'shadow'));
                button.classList.add('bg-slate-700', 'text-white', 'shadow');
                speedFactor = parseFloat(button.getAttribute('data-speed'));
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); btnPlay.click(); }
            if (e.code === 'ArrowLeft') { currentStep = Math.max(0, currentStep - 1); slider.value = currentStep; draw(); }
            if (e.code === 'ArrowRight') { currentStep = Math.min(dates.length - 1, currentStep + 1); slider.value = currentStep; draw(); }
        });

        window.addEventListener('resize', () => {
            if (domCache.length) { lastNameColWidth = 0; updateNameColumnWidth(); }
        });

        loadData();
    </script>
</body>

</html>
